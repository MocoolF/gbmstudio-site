<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка отправлена | GBM Studio</title>
  <style>
    @font-face {
      font-family: 'Involve';
      src: url('fonts/Involve-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Involve';
      src: url('fonts/Involve-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Involve', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #24313a;
      background: #f4f4f4;
    }
    .thanks-card {
      width: min(640px, 100%);
      padding: 48px;
      border-radius: 24px;
      background: #fff;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
    }
    p {
      margin: 0 0 28px;
      font-size: 20px;
      line-height: 1.45;
      color: #6d777d;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 28px;
      border-radius: 999px;
      background: #4b89f5;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="thanks-card">
    <h1>Заявка отправлена</h1>
    <p>Спасибо. Мы получили вашу заявку и скоро свяжемся с вами.</p>
    <a href="/">Вернуться на сайт</a>
  </main>
</body>
</html>
